<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DARKWOOD</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="gameWrapper">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">

        <div id="topHud">
            <div id="gameTitle">DARKWOOD</div>

            <div id="bars">
                <div class="bar">
                    <span>HP</span>
                    <div class="barBackground">
                        <div id="hpBar"></div>
                    </div>
                </div>

                <div class="bar">
                    <span>STAMINA</span>
                    <div class="barBackground">
                        <div id="staminaBar"></div>
                    </div>
                </div>
            </div>

            <div id="dayText">DIA 1 — MANHÃ</div>
            <div id="resourceText">🪵 0 &nbsp; 🪨 0 &nbsp; 🍄 0</div>
        </div>

        <div id="questBox">
            <div class="questTitle">MISSÃO</div>
            <div id="questText">
                Explore a floresta e encontre um cogumelo estranho.
            </div>
        </div>

        <div id="interaction"></div>
    </div>

    <div id="damageFlash"></div>

    <div id="joystick">
        <div id="joystickKnob"></div>
    </div>

    <button id="interactButton">E</button>
    <button id="attackButton">⚔</button>
    <button id="dodgeButton">◆</button>

    <div id="loading">
        <div class="loadingTitle">DARKWOOD</div>
        <div class="loadingText">Carregando floresta...</div>
    </div>

</div>

<script src="game.js"></script>

</body>
</html>
