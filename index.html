<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Darkwood Fantasy</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="hud">
            <div id="game-title">DARKWOOD</div>

            <div id="stats">
                <div class="stat">
                    <span>HP</span>
                    <div class="bar">
                        <div id="health-bar"></div>
                    </div>
                </div>

                <div class="stat">
                    <span>STAMINA</span>
                    <div class="bar">
                        <div id="stamina-bar"></div>
                    </div>
                </div>
            </div>

            <div id="time-display">DIA</div>
        </div>

        <div id="interaction">
            <span id="interaction-text"></span>
        </div>

        <div id="mobile-controls">

            <div id="joystick">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>

            <div id="action-buttons">
                <button id="attack-button">⚔</button>
                <button id="interact-button">E</button>
            </div>

        </div>

        <div id="loading">
            <div>DARKWOOD</div>
            <small>Carregando floresta...</small>
        </div>
    </main>

    <script src="game.js"></script>

</body>
</html>
