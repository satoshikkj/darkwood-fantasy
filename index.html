<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Darkwood V5</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">

    <div id="status">
      <div class="bar">
        <span>VIDA</span>
        <div class="bar-bg">
          <div id="hpBar" class="bar-fill hp"></div>
        </div>
      </div>

      <div class="bar">
        <span>ENERGIA</span>
        <div class="bar-bg">
          <div id="staminaBar" class="bar-fill stamina"></div>
        </div>
      </div>
    </div>

    <div id="questBox">
      <div class="quest-title">MISSÃO</div>
      <div id="questName">O Cogumelo que Sussurra</div>
      <div id="questObjective"></div>
    </div>

    <button id="inventoryButton">🎒</button>
  </div>

  <!-- INVENTÁRIO -->
  <div id="inventoryPanel" class="panel hidden">

    <div class="panel-header">
      <h2>Inventário</h2>
      <button id="closeInventory">✕</button>
    </div>

    <div class="resources">

      <div class="resource">
        <span>🪵 Madeira</span>
        <strong id="woodCount">0</strong>
      </div>

      <div class="resource">
        <span>🪨 Pedra</span>
        <strong id="stoneCount">0</strong>
      </div>

      <div class="resource">
        <span>🍄 Cogumelo</span>
        <strong id="mushroomCount">0</strong>
      </div>

      <div class="resource">
        <span>🍄 Cogumelo estranho</span>
        <strong id="strangeCount">0</strong>
      </div>

    </div>

    <h3>Itens fabricados</h3>

    <div class="crafted">

      <div class="resource">
        <span>🔥 Fogueira</span>
        <strong id="campfireCount">0</strong>
      </div>

      <div class="resource">
        <span>🪓 Machado</span>
        <strong id="axeCount">0</strong>
      </div>

      <div class="resource">
        <span>⚔️ Espada</span>
        <strong id="swordCount">0</strong>
      </div>

      <div class="resource">
        <span>🧪 Poção</span>
        <strong id="potionCount">0</strong>
      </div>

    </div>

    <h3>Fabricar</h3>

    <div class="craft-buttons">

      <button data-craft="campfire">
        🔥 Fogueira
        <small>5 madeira + 3 pedra</small>
      </button>

      <button data-craft="axe">
        🪓 Machado
        <small>8 madeira + 4 pedra</small>
      </button>

      <button data-craft="sword">
        ⚔️ Espada simples
        <small>5 madeira + 8 pedra</small>
      </button>

      <button data-craft="potion">
        🧪 Poção simples
        <small>2 cogumelos + 1 madeira</small>
      </button>

    </div>

  </div>

  <!-- DIÁLOGO -->
  <div id="dialoguePanel" class="dialogue hidden">

    <div class="dialogue-box">

      <div class="dialogue-header">
        <div id="dialogueAvatar">👴</div>

        <div>
          <div id="dialogueName">Ancião</div>
          <div id="dialogueRole">Guardião da floresta</div>
        </div>
      </div>

      <div id="dialogueText"></div>

      <div id="dialogueChoices"></div>

      <button id="dialogueContinue">
        Continuar
      </button>

    </div>

  </div>

  <!-- CONTROLES MOBILE -->
  <div id="mobileControls">

    <div id="joystick">
      <div id="joystickKnob"></div>
    </div>

    <div class="action-buttons">

      <button id="interactButton">E</button>

      <button id="attackButton">⚔</button>

      <button id="dodgeButton">↯</button>

    </div>

  </div>

  <div id="interactionHint"></div>

  <div id="message"></div>

  <script src="game.js"></script>

</body>
</html>
