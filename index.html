<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>DARKWOOD</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="gameCanvas"></canvas>

    <!-- HUD -->

    <div id="hud">

        <div class="top-left">

            <div class="game-title">
                DARKWOOD
            </div>

            <div class="status">

                <div class="bar hp">
                    <div id="hpBar"></div>
                </div>

                <div class="bar stamina">
                    <div id="staminaBar"></div>
                </div>

            </div>

            <div id="dayText">
                DIA 1 • COGUMELOS 0
            </div>

        </div>

    </div>

    <!-- Mensagens -->

    <div id="interaction">
        Explore a floresta.
    </div>

    <!-- Joystick -->

    <div id="joystick">

        <div id="joystickKnob"></div>

    </div>

    <!-- Botões -->

    <div id="actions">

        <button id="interactButton">
            E
        </button>

        <button id="attackButton">
            ⚔
        </button>

    </div>

    <!-- Loading -->

    <div id="loading">

        <div class="loading-title">
            DARKWOOD
        </div>

        <div class="loading-subtitle">
            A floresta está esperando...
        </div>

    </div>

    <script src="game.js"></script>

</body>

</html>
